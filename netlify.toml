# Netlify : publie le dossier site/ tel quel (aucune étape de compilation).
[build]
  publish = "site"

# MAQUETTE : empêche Google d'indexer le site tant que le salon n'a pas validé.
# À supprimer le jour de la mise en ligne officielle.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
